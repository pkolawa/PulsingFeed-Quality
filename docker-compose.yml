version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulsingfeed
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

  python-worker:
    build: ./python
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pulsingfeed
      LLM_PROVIDER:    ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY:  ${OPENAI_API_KEY}
      LLM_MODEL:       ${LLM_MODEL}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-10}
      WORKER_BATCH_SIZE:    ${WORKER_BATCH_SIZE:-5}
    depends_on:
      - postgres
    develop:
      watch:
        - action: rebuild
          path: ./python/requirements.txt
        - action: sync+restart
          path: ./python
          target: /app
          ignore:
            - __pycache__/
            - "*.pyc"
            - .venv/

  collector:
    build: ./node/collector
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pulsingfeed
    depends_on:
      - postgres
    develop:
      watch:
        - action: rebuild
          path: ./node/collector/package.json
        - action: sync+restart
          path: ./node/collector/src
          target: /app/src

  api:
    build: ./node/api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pulsingfeed
      PORT: 3001
    depends_on:
      - postgres
    develop:
      watch:
        - action: rebuild
          path: ./node/api/package.json
        - action: sync+restart
          path: ./node/api/src
          target: /app/src

  web:
    build: ./node/web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      API_URL: http://api:3001
    depends_on:
      - api
    develop:
      watch:
        - action: rebuild
          path: ./node/web/package.json
        - action: sync+restart
          path: ./node/web/src
          target: /app/src
        - action: sync
          path: ./node/web/public
          target: /app/public

volumes:
  postgres_data:
